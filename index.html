<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>今週の論文</title>
<style>
  :root{
    --ground:#FBFAF8; --card:#FFFFFF; --line:#E8E4DC; --ink:#1E1C19; --muted:#6C665C;
    --faint:#9A9389; --accent:#7A5C2E; --accent-bg:#F5EFE3;
    --sans: system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{--ground:#14130F; --card:#1C1A16; --line:#2E2A24; --ink:#EDE9E1; --muted:#A79F93;
      --faint:#7C7468; --accent:#C9A468; --accent-bg:#252017;}
  }
  :root[data-theme="light"]{--ground:#FBFAF8; --card:#FFFFFF; --line:#E8E4DC; --ink:#1E1C19;
    --muted:#6C665C; --faint:#9A9389; --accent:#7A5C2E; --accent-bg:#F5EFE3;}
  :root[data-theme="dark"]{--ground:#14130F; --card:#1C1A16; --line:#2E2A24; --ink:#EDE9E1;
    --muted:#A79F93; --faint:#7C7468; --accent:#C9A468; --accent-bg:#252017;}
  /* Phone-first, same scale as the weekly digest: 16px body, no justify (it opens rivers in
     Japanese at narrow widths), generous side padding, tappable links. */
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0}
  .wrap{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;
    line-height:1.9;-webkit-font-smoothing:antialiased;padding:1.5rem 1.15rem 4rem;
    min-height:100vh}
  .inner{max-width:34rem;margin:0 auto}
  .eyebrow{font-size:.72rem;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;
    margin:0 0 .5rem}
  h1{font-size:1.34rem;font-weight:700;line-height:1.55;margin:0 0 .5rem;text-wrap:balance}
  .meta{font-size:.84rem;color:var(--muted);margin:0 0 1.15rem;line-height:1.75}
  .oneline{background:var(--accent-bg);border-left:3px solid var(--accent);
    border-radius:0 10px 10px 0;padding:.9rem .95rem;font-size:1rem;font-weight:600;
    line-height:1.8;margin:0 0 1.5rem}
  .hook{font-size:1rem;color:var(--ink);margin:0 0 1.9rem}
  h2{font-size:.76rem;font-weight:700;letter-spacing:.14em;color:var(--accent);
    margin:2rem 0 .8rem;padding-bottom:.45rem;border-bottom:1px solid var(--line)}
  p{margin:0 0 .95rem;font-size:1rem}
  p:last-child{margin-bottom:0}
  .find{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:1rem .95rem;margin-bottom:.75rem}
  .find .pt{font-size:1rem;font-weight:700;line-height:1.65;margin-bottom:.4rem}
  .find .dt{font-size:.94rem;color:var(--muted);line-height:1.85}
  .apply{display:flex;flex-direction:column;gap:.75rem}
  .app{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:.95rem}
  .app .sc{font-size:.74rem;font-weight:700;color:var(--accent);letter-spacing:.06em;
    margin-bottom:.35rem}
  .app .ac{font-size:.97rem;line-height:1.85}
  .limits{background:var(--card);border:1px dashed var(--line);border-radius:12px;
    padding:1rem .95rem;font-size:.95rem;color:var(--muted);line-height:1.85}
  .src{display:inline-block;margin-top:1.7rem;font-size:.86rem;color:var(--muted);
    text-decoration:none;border:1px solid var(--line);border-radius:9px;
    padding:.6rem .8rem;line-height:1.5;word-break:break-word}
  .src:hover{color:var(--accent);border-color:var(--accent)}
  footer{margin-top:2.4rem;padding-top:1.1rem;border-top:1px solid var(--line);
    font-size:.78rem;color:var(--faint);line-height:1.7}
  a:focus-visible,.src:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.55rem}
  a.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;text-decoration:none;color:var(--ink);font-weight:600;font-size:1rem}
  a.item:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="wrap"><div class="inner">
  <p class="eyebrow">Paper of the week</p>
  <h1>今週の論文</h1>
  <p class="meta">経営学の論文をひとつ選び、構造的に解説します。毎週水曜。</p>
  <ul>
      <li><a class="item" href="2026-07-31.html">2026-07-31</a></li>
  </ul>
  <footer>「自社でどう使うか」は本記事による解釈で、原論文の主張ではありません。</footer>
</div></div>
</body>
</html>
